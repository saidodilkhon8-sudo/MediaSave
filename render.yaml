services:
  - type: web
    name: mediasave-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m mediasave.main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: YOUTUBE_COOKIES_BASE64
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///mediasave.db
      - key: TEMP_DIR
        value: ./temp
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: LOG_LEVEL
        value: INFO
