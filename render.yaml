services:
  - type: web
    name: mediasave-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m mediasave.main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: YOUTUBE_COOKIES_BASE64
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mediasave-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mediasave-redis
          type: redis
          property: connectionString
      - key: TEMP_DIR
        value: ./temp
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: LOG_LEVEL
        value: INFO
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_IDS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "3"

  - type: worker
    name: mediasave-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m mediasave.main
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: YOUTUBE_COOKIES_BASE64
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mediasave-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mediasave-redis
          type: redis
          property: connectionString
      - key: TEMP_DIR
        value: ./temp
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: LOG_LEVEL
        value: INFO
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_IDS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "3"

  - type: redis
    name: mediasave-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: mediasave-db
    plan: free
    databaseName: mediasave
    user: mediasave
